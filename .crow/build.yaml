when:
  - event: [pull_request, pull_request_closed]
  - event: manual
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

labels:
  type: static

depends_on:
  - lint

steps:
  - name: Build
    image: reg.ricochet.rs/docker.io/oven/bun:1.4
    commands:
      - bun install --frozen-lockfile
      - bun astro build

  - name: PR docs preview
    image: reg.ricochet.rs/docker.io/woodpeckerci/plugin-surge-preview:1.5.0
    settings:
      path: "./dist"
      surge_token:
        from_secret: surge_token
      forge_repo_token:
        from_secret: ricochet_issue_token
      forge_type: github
    when:
      - event: [pull_request, pull_request_closed]

  - name: "Upload to S3"
    image: reg.ricochet.rs/docker.io/rclone/rclone:1.75
    environment:
      RCLONE_CONFIG_B2_TYPE: s3
      RCLONE_CONFIG_B2_PROVIDER: Other
      RCLONE_CONFIG_B2_REGION: eu-central-003
      RCLONE_CONFIG_B2_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
      RCLONE_CONFIG_B2_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_B2_ACCESS_KEY_ID:
        from_secret:
          integration: 1
          path: backblaze/tokens/cicd
          key: keyID
      RCLONE_CONFIG_B2_SECRET_ACCESS_KEY:
        from_secret:
          integration: 1
          path: backblaze/tokens/cicd
          key: applicationKey
    commands:
      - rclone copy dist/ b2:ricochet-docs --checksum --transfers 16 --fast-list --retries 3
    when:
      - event: manual
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
