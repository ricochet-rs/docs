when:
  - event: pull_request
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: cron
    cron: nightly
  - event: push
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}

labels:
  type: static

steps:
  editor-config:
    image: reg.ricochet.rs/docker.io/mstruebing/editorconfig-checker:4.0.2
    depends_on: []

  prettier:
    image: oven/bun:1.4
    commands:
      - bun install --frozen-lockfile
      - bun prettier --check .
    depends_on: []

  readability:
    image: oven/bun:1.4
    commands:
      - bun run scripts/readability.mjs
    depends_on: []

  vale:
    when:
      - event: pull_request
        path: "src/content/docs/**"
    image: reg.ricochet.rs/docker.io/jdkato/vale:v3.23.0
    commands:
      - apk add -q --no-cache jq
      - vale sync
      - echo "$${CI_PIPELINE_FILES}" | jq -r '.[] | select(test("^src/content/docs/.*\\.mdx?$"))' | while read -r f; do [ -f "$f" ] && echo "$f"; done | xargs -r vale
    depends_on: []

  commitlint:
    when:
      - event: pull_request
      - event: pull_request_edited
    image: reg.ricochet.rs/docker.io/commitlint/commitlint:21.2.3
    commands:
      - echo $${CI_COMMIT_PULL_REQUEST_TITLE} | commitlint
