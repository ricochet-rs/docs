when:
  - event: pull_request
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: cron
    cron: nightly
  - event: push
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}

labels:
  type: static

cache:
  - key: 'bun-v1-{{ arch }}-{{ checksum "bun.lock" }}'
    restore_keys: ["bun-v1-{{ arch }}-"]
    paths: [.cache/bun]
  - key: 'readability-v1-{{ arch }}-{{ checksum "scripts/readability.mjs" }}'
    paths: [node_modules/.cache/readability]

steps:
  editor-config:
    image: reg.ricochet.rs/docker.io/mstruebing/editorconfig-checker:4.0.2
    depends_on: []

  prettier:
    image: oven/bun:1.4
    environment:
      BUN_INSTALL_CACHE_DIR: ${CI_WORKSPACE}/.cache/bun
    commands:
      - bun install --frozen-lockfile
      - bun prettier --check .
    depends_on: []

  readability:
    image: oven/bun:1.4
    commands:
      - bun run scripts/readability.mjs
    depends_on: []

  commitlint:
    when:
      - event: pull_request
      - event: pull_request_edited
    image: reg.ricochet.rs/docker.io/commitlint/commitlint:21.2.3
    commands:
      - echo $${CI_COMMIT_PULL_REQUEST_TITLE} | commitlint
